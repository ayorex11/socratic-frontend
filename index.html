<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>SocraSeek - AI-Powered Study Assistant</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinyurl.com/socraticAIAPP" />

      property="og:description"
      content="Upload PDFs, get AI summaries, audio versions, and quizzes. Browse community study materials shared by other students."

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tinyurl.com/socraticAIAPP" />

      property="twitter:description"
      content="Upload PDFs, get AI summaries, audio versions, and quizzes. Browse community study materials shared by other students."

    <meta property="og:locale" content="en_US" />

    <meta name="theme-color" content="#27ae60" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
